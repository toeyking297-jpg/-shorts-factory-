name: Find Trends

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to analyse (Thai or English). Empty = channel default"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: shorts-factory
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: เตรียมระบบ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: วิเคราะห์เทรนด์
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_NICHE: ${{ inputs.niche }}
        run: python -m engine.run trends --niche "$IN_NICHE"
      - name: บันทึกรายงาน
        run: |
          git config user.name "shorts-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends
          git commit -m "Trend report" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
