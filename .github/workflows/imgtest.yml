name: Image test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imgtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: ทดสอบสร้างภาพฟรี
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m engine.imgtest
      - name: ส่งผล
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(final/imgtest_*)
          [ ${#files[@]} -gt 0 ] || exit 0
          gh release delete imgtest --yes --cleanup-tag 2>/dev/null || true
          gh release create imgtest "${files[@]}" --title "Image test" --notes-file final/imgtest_report.md
