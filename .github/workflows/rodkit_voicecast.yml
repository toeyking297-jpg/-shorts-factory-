name: rodkit voice cast (ElevenLabs)

# catalog = ดึงรายชื่อเสียงไทยมาเก็บใน repo · lock = ล็อกเสียงตาม cast.json + ทำเสียงยืนยัน (Releases: rodkit-voices-locked)
on:
  workflow_dispatch:
    inputs:
      step:
        description: "catalog หรือ lock"
        required: true
        default: catalog

permissions:
  contents: write

jobs:
  cast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Run
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m rodkit.voice_tools ${{ github.event.inputs.step }}
      - name: Save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rodkit-bot"
          git config user.email "rodkit-bot@users.noreply.github.com"
          git add rodkit/voice_catalog.json rodkit/cast.json 2>/dev/null || true
          git commit -m "rodkit: voice cast ${{ github.event.inputs.step }} [skip ci]" || echo "nothing new"
          git pull --rebase -q && git push
          if [ "${{ github.event.inputs.step }}" = "lock" ]; then
            gh release delete rodkit-voices-locked --yes --cleanup-tag 2>/dev/null || true
            gh release create rodkit-voices-locked rodkit/voice_samples/* --title "เสียงตัวละครที่ล็อกแล้ว" --notes-file rodkit/voice_samples/locked.md
          fi
