<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Kanit;font-weight:900;src:url(../../assets/fonts/Kanit-Black.ttf)}
html,body{margin:0;background:#000}</style></head><body><div id="st"></div>
<script src="lib/core.js"></script><script src="lib/flat_moto.js"></script>
<script>
function bg(){ // ลานจอดในร่ม: เสา คาน แสงไกล พื้นปูนเงา (เบลอให้มีมิติ)
  let s='<rect width="1600" height="1000" fill="#7E8389"/>';
  s+='<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E636A"/><stop offset=".55" stop-color="#A7ADB3"/><stop offset="1" stop-color="#3E4247"/></linearGradient><rect width="1600" height="700" fill="url(#g1)"/>';
  s+='<g filter="url(#bb)">';
  for(let i=0;i<8;i++){const x=60+i*220;s+=`<rect x="${x}" y="0" width="${i%2?46:60}" height="700" fill="#5A5F66"/><rect x="${x+8}" y="0" width="10" height="700" fill="#8C9198" opacity=".6"/>`;}
  for(let y=40;y<300;y+=60)s+=`<rect x="0" y="${y}" width="1600" height="14" fill="#4E535A" opacity=".8"/>`;
  for(let i=0;i<14;i++)s+=`<line x1="${i*130}" y1="40" x2="${i*130+90}" y2="300" stroke="#4E535A" stroke-width="8"/>`;
  s+='<rect x="0" y="420" width="1600" height="160" fill="#C9D4DC" opacity=".55"/><rect x="980" y="440" width="260" height="110" fill="#3C7FD0" opacity=".55"/><rect x="1450" y="430" width="150" height="140" fill="#2E6FC0" opacity=".5"/><rect x="200" y="470" width="300" height="70" fill="#E6E2D8" opacity=".5"/>';
  s+='</g>';
  s+='<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C6167"/><stop offset="1" stop-color="#2E3135"/></linearGradient><rect y="640" width="1600" height="360" fill="url(#g2)"/>';
  s+='<radialGradient id="g3" cx=".5" cy=".5" r=".6"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>';
  return s;
}
window.draw=function(spin){
  const defs='<defs><filter id="fBlur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter><filter id="bb"><feGaussianBlur stdDeviation="7"/></filter>'+RK.flatMotoDefs+'</defs>';
  const bike=RK.flatMoto({spin});
  const refl=`<g transform="translate(800,848) scale(1,-1)" opacity=".16" filter="url(#bb)">${bike}</g>`;
  document.getElementById('st').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">${defs}${bg()}${refl}<g transform="translate(800,842)">${bike}</g><rect width="1600" height="1000" fill="url(#g3)"/></svg>`;
};
document.fonts.load('900 40px Kanit').then(()=>{window.READY=true});
</script></body></html>
